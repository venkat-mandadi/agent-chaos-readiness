[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-chaos-readiness"
version = "0.1.0"
description = "Resilience readiness scoring, chaos safety gating, and LitmusChaos experiment generation for GKE."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Venkat Mandadi" }]
keywords = ["chaos-engineering", "litmuschaos", "resilience", "sre", "kubernetes", "gke", "mcp", "reliability"]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=8.0", "ruff==0.15.11"]

[project.scripts]
chaos-plan = "chaos_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
